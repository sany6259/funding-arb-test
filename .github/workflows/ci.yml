name: funding-arb CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/vps-install-compatibility, feat/demo-futures-issue-17]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests import venue adapters (requests) and server.routes (fastapi),
      # so collection needs the runtime + server deps — not just pytest.
      # The optional venue SDKs are intentionally omitted (tests guard them).
      # Windows is covered so the file-lock path (fcntl on Unix / msvcrt on
      # Windows) stays green on both platforms.
      - run: pip install -r server/requirements.txt requests pytest
      - run: python -m pytest scripts/tests/ -q

  install-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash scripts/tests/smoke_install.sh
      - run: npm run test:i18n
        working-directory: web
      - run: npm run test:demo-navigation
        working-directory: web
      - run: test -z "$(git status --porcelain)"

  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: bash scripts/tools/check_docs_sync.sh

  scanner-validation-pydantic1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The minimum supported FastAPI also allows Pydantic 1; keep its
      # query-validation behavior covered alongside the default CI install.
      - run: pip install 'fastapi==0.110.0' 'pydantic<2' requests pytest
      - run: python -m pytest scripts/tests/test_scanner_query_validation.py -q
